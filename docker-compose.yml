services:
  postgres:
    image: postgres:16
    container_name: reflex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reflex
      POSTGRES_PASSWORD: reflex_dev_password
      POSTGRES_DB: reflex
    ports:
      - "5432:5432"
    volumes:
      - reflex_pg_data:/var/lib/postgresql/data
      - ./backend/src/config/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

volumes:
  reflex_pg_data:
