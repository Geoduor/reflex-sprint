services:
  - type: web
    name: reflex-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && node src/config/setup.js
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reflex-db
          property: connectionString
      - key: PORT
        value: 4000
      - key: FRONTEND_URL
        sync: false # set manually once the frontend URL is known (avoids a circular reference)

  - type: web
    name: reflex-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # set manually to the backend's Render URL + /api, e.g. https://reflex-backend.onrender.com/api
      - key: VITE_SOCKET_URL
        sync: false # set manually to the backend's Render URL, e.g. https://reflex-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html # required for React Router — without this, refreshing on /rider/123 returns a 404

databases:
  - name: reflex-db
    plan: free
    databaseName: reflex
    user: reflex
